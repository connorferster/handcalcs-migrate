name: Build docs and publish to Bunny.net

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.1"
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Build docs
      # The 'doc' group is Sphinx and its extensions.
      run: uv run --locked --only-group doc sphinx-build -W -b html docs docs/_build/html
    - name: Deploy to BunnyCDN
      # Pull requests only build the docs; a push to main deploys them.
      if: github.event_name == 'push'
      uses: ayeressian/bunnycdn-storage-deploy@v2.3.0
      with:
          source: "./docs/_build/html"
          destination: "."
          storageZoneName: "${{ secrets.STORAGE_NAME }}"
          storagePassword: "${{ secrets.STORAGE_PASSWORD }}"
          storageEndpoint: "uk.storage.bunnycdn.com"  # same region as the handcalcs docs (London)
          accessKey: "${{ secrets.STORAGE_KEY }}"
          pullZoneId: "${{ secrets.ZONE_ID }}"
          upload: "true"
          remove: "true"
          purgePullZone: "true"
          purgePullZoneDelay: "5"
